<!DOCTYPE html>
<html lang="pt_BR">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" type="text/css" href="styles.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
            crossorigin="anonymous"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
            integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link
            rel="stylesheet"
            href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css"
        />
        <link
            rel="stylesheet"
            href="//cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.2/jquery-confirm.min.css"
        />
        <title>Desafio Desenvolvedor PontoSistemas</title>
    </head>
    <body>
        <input type="hidden" name="usrid" id="usrid" />
        <div id="container" name="container">
            <form action="api.php" method="POST" id="usrForm" name="usrForm">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input
                        type="text"
                        class="form-control"
                        id="nome"
                        name="nome"
                        placeholder="Nome"
                        required
                    />
                </div>
                <div class="mb-3">
                    <div class="d-flex">
                        <div
                            class="form-input"
                            style="margin-right: 1rem; flex: 1;"
                        >
                            <label for="nascimento" class="form-label"
                                >Nascimento</label
                            >
                            <input
                                type="date"
                                class="form-control"
                                id="nascimento"
                                name="nascimento"
                                placeholder="Nascimento"
                            />
                        </div>
                        <div class="form-input" style="flex: 2;">
                            <label for="email" class="form-label">E-mail</label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="E-mail"
                                required
                            />
                        </div>
                    </div>
                </div>
                <div name="botoesForm" id="botoesForm">
                    <button
                        type="submit"
                        name="enviar"
                        id="enviar"
                        class="btn btn-outline-success disabled"
                        style="margin-right: 1rem;"
                    >
                        Criar
                    </button>
                    <button
                        type="reset"
                        name="limpar"
                        id="limpar"
                        class="btn btn-info"
                    >
                        Limpar
                    </button>
                </div>
            </form>
            <table id="dados" name="dados">
                <thead>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Nascimento</th>
                    <th>Email</th>
                    <th>Ação</th>
                </thead>
                <tbody id="lista" name="lista"></tbody>
            </table>
        </div>

        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
            integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <script src="//cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.2/jquery-confirm.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment-with-locales.min.js"
            integrity="sha512-42PE0rd+wZ2hNXftlM78BSehIGzezNeQuzihiBCvUEB3CVxHvsShF86wBWwQORNxNINlBPuq7rG4WWhNiTVHFg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <script src="scripts.js"></script>
    </body>
</html>
